name: ATSH AI clean rebuild — staging deploy
on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Existing Azure resource group for staging
        required: true
        type: string
      app_name:
        description: Existing staging Web App name (must end in -staging)
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/rebuild/atsh-ai-clean-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Validate staging target and secrets
        env:
          APP_NAME: ${{ inputs.app_name }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          [[ "$APP_NAME" == *-staging ]] || { echo "Refusing deployment: app_name must end in -staging"; exit 1; }
          [[ -n "$RESOURCE_GROUP" && -n "$DATABASE_URL" ]] || { echo "Configure staging-only target and database secret"; exit 1; }
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package
        run: zip -r atsh-ai-clean-staging.zip . -x 'node_modules/*' '.env*' '*.log'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify staging App Service
        env:
          APP_NAME: ${{ inputs.app_name }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
        run: |
          set -euo pipefail
          state=$(az webapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query state -o tsv)
          [[ "$state" == "Running" ]] || { echo "Staging App Service must exist and be Running"; exit 1; }
      - name: Configure staging runtime (staging database only)
        env:
          APP_NAME: ${{ inputs.app_name }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          az webapp config appsettings set --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --settings NODE_ENV=production PORT=8080 PGSSL=require DEFAULT_ORGANIZATION_SLUG=atsh-ai PUBLIC_BASE_URL="https://$APP_NAME.azurewebsites.net" DATABASE_URL="$DATABASE_URL" WEBSITE_NODE_DEFAULT_VERSION='~22' SCM_DO_BUILD_DURING_DEPLOYMENT=true --output none
          az webapp config set --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --startup-file "npm start" --output none
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app_name }}
          package: atsh-ai-clean-staging.zip
      - name: Verify process health and database readiness
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "https://$APP_NAME.azurewebsites.net/health" || true)
            if [[ "$code" == "200" ]] && grep -q '"ok":true' /tmp/health.json; then break; fi
            sleep 10
          done
          [[ "${code:-}" == "200" ]] || { cat /tmp/health.json || true; exit 1; }
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "https://$APP_NAME.azurewebsites.net/ready" || true)
            if [[ "$code" == "200" ]] && grep -q '"ok":true' /tmp/ready.json; then cat /tmp/health.json; cat /tmp/ready.json; exit 0; fi
            sleep 10
          done
          cat /tmp/ready.json || true
          echo "Staging database readiness failed; do not promote this release."
          exit 1
