name: ATSH AI isolated backup restore test
on:
  workflow_dispatch:
    inputs:
      confirm_restore_test:
        description: Confirm that RESTORE_TEST_DATABASE_URL points to a disposable, empty, isolated database and may receive a copy of production data
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
permissions:
  contents: read
jobs:
  restore-test:
    if: inputs.confirm_restore_test == 'yes'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
      RESTORE_TEST_DATABASE_URL: ${{ secrets.RESTORE_TEST_DATABASE_URL }}
      PGSSLMODE: require
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_BACKUP_STORAGE_CONNECTION_STRING }}
      DEFAULT_ORGANIZATION_SLUG: atsh-ai
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install platform dependencies
        run: npm install
      - name: Decrypt latest backup and restore to isolated target
        run: npm run backup:restore-test
