name: ATSH AI Customer Portal Foundation CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'greenfield/**'
      - '.github/workflows/customer-portal-ci.yml'
  push:
    branches: [feature/greenfield-customer-portal-foundation]
    paths:
      - 'greenfield/**'
      - '.github/workflows/customer-portal-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: greenfield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: greenfield/package.json
      - run: npm install --package-lock-only
      - run: npm install
      - run: npm run build
      - run: npm test
