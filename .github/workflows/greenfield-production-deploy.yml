name: Deploy ATSH AI Greenfield to Azure Production

on:
  # Production platform/greenfield deployments are manual until each has its own Azure App Service.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atsh-ai-greenfield-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: greenfield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: greenfield/package.json
      - run: npm install --package-lock-only
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Package greenfield app
        run: |
          set -euo pipefail
          zip -r ../atsh-ai-greenfield.zip . -x '.data/*' '*.log' '.env*'
      - uses: actions/upload-artifact@v4
        with:
          name: atsh-ai-greenfield
          path: atsh-ai-greenfield.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atsh-ai-greenfield
      - name: Verify required production configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEFAULT_ORGANIZATION_ID: ${{ secrets.DEFAULT_ORGANIZATION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1DF03D06E1D444CCA0654B27E8C75231 }}
          AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_5EF8FCB25D80477A8D0F2FCEE63A981A }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A4D19EA9941D4136AF1DD6E315BFA1E2 }}
        run: |
          set -euo pipefail
          for key in DATABASE_URL DEFAULT_ORGANIZATION_ID AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $key. Deployment stopped."
              exit 1
            fi
          done
          if ! [[ "$DEFAULT_ORGANIZATION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::DEFAULT_ORGANIZATION_ID is not a valid UUID."
            exit 1
          fi
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1DF03D06E1D444CCA0654B27E8C75231 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5EF8FCB25D80477A8D0F2FCEE63A981A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A4D19EA9941D4136AF1DD6E315BFA1E2 }}
      - name: Locate existing production app
        id: app
        run: |
          set -euo pipefail
          APP='atsh-ai-website'
          RG=$(az webapp list --query "[?name=='$APP'].resourceGroup | [0]" -o tsv)
          if [ -z "$RG" ] || [ "$RG" = "None" ]; then
            echo "::error::Existing production App Service was not found; refusing to create a new app."
            exit 1
          fi
          HOST=$(az webapp show --resource-group "$RG" --name "$APP" --query defaultHostName -o tsv)
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
      - name: Configure Greenfield runtime without database migrations
        env:
          RG: ${{ steps.app.outputs.resource_group }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ORGANIZATION_ID: ${{ secrets.DEFAULT_ORGANIZATION_ID }}
          DIAGNOSTICS_TOKEN: ${{ secrets.DB_DIAGNOSTICS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECOVERY_FROM_EMAIL: ${{ secrets.ADMIN_RECOVERY_FROM_EMAIL }}
        run: |
          set -euo pipefail
          az webapp config appsettings set --resource-group "$RG" --name atsh-ai-website --settings             NODE_ENV=production WEBSITE_NODE_DEFAULT_VERSION='~22' SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true             DATABASE_URL="$DATABASE_URL" PUBLIC_ORGANIZATION_ID="$ORGANIZATION_ID" PUBLIC_BASE_URL="https://atsh-ai-website-ewa4dcc8dygdhqdp.westus3-01.azurewebsites.net" RESEND_API_KEY="${RESEND_API_KEY:-}" ADMIN_RECOVERY_FROM_EMAIL="${RECOVERY_FROM_EMAIL:-}" PGSSL=require             INQUIRY_INTAKE_ENABLED=false DB_DIAGNOSTICS_TOKEN="${DIAGNOSTICS_TOKEN:-}"             --output none
          az webapp config set --resource-group "$RG" --name atsh-ai-website --startup-file "node server.js" --output none
          az webapp start --resource-group "$RG" --name atsh-ai-website
      - name: Deploy Greenfield app
        uses: azure/webapps-deploy@v3
        with:
          app-name: atsh-ai-website
          package: atsh-ai-greenfield.zip
      - name: Verify live health and readiness
        env:
          HOST: ${{ steps.app.outputs.host }}
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "https://$HOST/health" || true)
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.json; then break; fi
            sleep 10
          done
          if [ "${code:-}" != "200" ]; then cat /tmp/health.json || true; echo "::error::Greenfield health check failed."; exit 1; fi
          ready=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "https://$HOST/ready" || true)
          if [ "$ready" != "200" ]; then cat /tmp/ready.json || true; echo "::error::Database readiness check failed; inspect Azure runtime logs."; exit 1; fi
          cat /tmp/health.json
          cat /tmp/ready.json
