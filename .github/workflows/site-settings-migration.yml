name: ATSH AI apply site settings migration
on:
  workflow_dispatch:
    inputs:
      confirm_production_migration:
        description: Confirm that this applies the additive site_settings and admin password recovery tables to the configured production database
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
permissions:
  contents: read
concurrency:
  group: atsh-ai-site-settings-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: inputs.confirm_production_migration == 'yes'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate database configuration and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is missing; no changes made."
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -c "SELECT 1"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -c "DO \$\$ BEGIN IF to_regclass('public.organizations') IS NULL THEN RAISE EXCEPTION 'Required table public.organizations is missing'; END IF; IF to_regclass('public.users') IS NULL THEN RAISE EXCEPTION 'Required table public.users is missing'; END IF; IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='organizations' AND column_name='id' AND data_type='uuid') THEN RAISE EXCEPTION 'organizations.id must exist and be uuid'; END IF; IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='users' AND column_name='id' AND data_type='uuid') THEN RAISE EXCEPTION 'users.id must exist and be uuid'; END IF; END \$\$;"
      - name: Apply additive, idempotent migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X <<'SQL'
          CREATE TABLE IF NOT EXISTS public.site_settings (
            organization_id uuid PRIMARY KEY REFERENCES public.organizations(id) ON DELETE CASCADE,
            settings jsonb NOT NULL DEFAULT '{}'::jsonb CHECK (jsonb_typeof(settings) = 'object'),
            updated_by uuid NULL REFERENCES public.users(id) ON DELETE SET NULL,
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE IF NOT EXISTS public.admin_password_resets (
            token_hash text PRIMARY KEY CHECK (length(token_hash) = 64),
            user_id uuid NOT NULL REFERENCES public.users(id) ON DELETE CASCADE,
            expires_at timestamptz NOT NULL,
            used_at timestamptz NULL,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE INDEX IF NOT EXISTS admin_password_resets_user_id_idx ON public.admin_password_resets(user_id);
          CREATE INDEX IF NOT EXISTS admin_password_resets_expiry_idx ON public.admin_password_resets(expires_at);
          SQL
      - name: Verify table and constraints
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='site_settings' AND column_name='organization_id') OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='site_settings' AND column_name='settings' AND data_type='jsonb') OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='site_settings' AND column_name='updated_by') OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='site_settings' AND column_name='updated_at') THEN RAISE EXCEPTION 'site_settings schema verification failed'; END IF; END \$\$;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -c "DO \\$\\$ BEGIN IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='admin_password_resets' AND column_name='token_hash') OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='admin_password_resets' AND column_name='user_id') OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='admin_password_resets' AND column_name='expires_at') OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='admin_password_resets' AND column_name='used_at') THEN RAISE EXCEPTION 'admin_password_resets schema verification failed'; END IF; END \\$\\$;"
          echo "site settings and admin password recovery migrations applied and verified."
