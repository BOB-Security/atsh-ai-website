name: ATSH AI Clean Rebuild CI
on:
  push:
    branches: ['rebuild/atsh-ai-clean-v2']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atsh-clean-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
      - run: npm test
