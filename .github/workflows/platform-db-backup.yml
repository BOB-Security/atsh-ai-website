name: ATSH AI encrypted database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      BACKUP_ENABLED: ${{ secrets.BACKUP_ENABLED }}
      DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
      PGSSLMODE: require
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_BACKUP_STORAGE_CONNECTION_STRING }}
      BACKUP_CONTAINER: atsh-ai-db-backups
      BACKUP_RETENTION_DAYS: '30'
      DEFAULT_ORGANIZATION_SLUG: atsh-ai
    steps:
      - uses: actions/checkout@v4
      - name: Skip until backup secrets are configured
        if: env.BACKUP_ENABLED != 'true'
        run: echo "Backup is disabled. Set BACKUP_ENABLED=true and configure the documented repository secrets to enable scheduled backups."
      - uses: actions/setup-node@v4
        if: env.BACKUP_ENABLED == 'true'
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        if: env.BACKUP_ENABLED == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install platform dependencies
        if: env.BACKUP_ENABLED == 'true'
        working-directory: platform
        run: npm install
      - name: Create encrypted database backup
        if: env.BACKUP_ENABLED == 'true'
        working-directory: platform
        run: npm run backup:database
