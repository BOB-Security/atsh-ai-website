name: ATSH AI Admin Schema Error Code CI
on:
  push:
    branches: [fix/admin-schema-error-code]
    paths:
      - 'greenfield/**'
      - '.github/workflows/admin-schema-error-code-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'greenfield/**'
      - '.github/workflows/admin-schema-error-code-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: greenfield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: greenfield/package.json
      - run: npm install --package-lock-only
      - run: npm install
      - run: npm run build
      - run: npm test
