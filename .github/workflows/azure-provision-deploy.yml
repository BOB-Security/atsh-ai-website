name: Azure App Service — provision and deploy

on:
  push:
    branches: [main]
    paths:
      - 'infra/azure/main.bicep'
      - '.github/workflows/azure-provision-deploy.yml'
  workflow_dispatch:
    inputs:
      resource_group:
        description: Existing Azure Resource Group to use (do not create a duplicate app in a different group)
        required: false
        type: string
      app_name:
        description: Globally unique Azure Web App name; reuse only if it belongs to this resource group
        required: true
        type: string
        default: atsh-ai-website
      location:
        description: Azure region
        required: true
        type: choice
        options:
          - uaenorth
          - uaecentral
          - northeurope
          - westeurope
        default: uaenorth
      plan_sku:
        description: Paid App Service plan SKU; B1 is the default for custom-domain readiness
        required: true
        type: choice
        options:
          - B1
          - B2
          - B3
        default: B1

permissions:
  contents: read
  id-token: write

concurrency:
  group: atsh-ai-azure-provision
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install and verify
        run: |
          npm ci
          npm run build
          npm test
      - name: Prepare deployment package
        run: |
          zip -r atsh-ai-app.zip package.json server.js public scripts
      - uses: actions/upload-artifact@v4
        with:
          name: atsh-ai-app
          path: atsh-ai-app.zip
          if-no-files-found: error

  provision-and-deploy:
    runs-on: ubuntu-latest
    needs: verify
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: atsh-ai-app
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1DF03D06E1D444CCA0654B27E8C75231 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5EF8FCB25D80477A8D0F2FCEE63A981A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A4D19EA9941D4136AF1DD6E315BFA1E2 }}
      - name: Resolve existing app or validate new resource group
        id: resolve
        env:
          RG_INPUT: ${{ inputs.resource_group || '' }}
          APP: ${{ inputs.app_name || 'atsh-ai-website' }}
          LOCATION_INPUT: ${{ inputs.location || 'uaenorth' }}
          SKU_INPUT: ${{ inputs.plan_sku || 'B1' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          az account show --query '{subscription:id,name:name,tenant:tenantId}' -o table
          EXISTING_RG=$(az webapp list --query "[?name=='$APP'].resourceGroup | [0]" -o tsv)
          if [ -n "$EXISTING_RG" ] && [ "$EXISTING_RG" != "None" ]; then
            if [ -n "$RG_INPUT" ] && [ "$RG_INPUT" != "$EXISTING_RG" ]; then
              echo "The app exists in resource group '$EXISTING_RG', not '$RG_INPUT'. Refusing to create a duplicate." >&2
              exit 1
            fi
            RG="$EXISTING_RG"
            LOCATION=$(az webapp show --resource-group "$RG" --name "$APP" --query location -o tsv)
            PLAN_ID=$(az webapp show --resource-group "$RG" --name "$APP" --query serverFarmId -o tsv)
            PLAN="${PLAN_ID##*/}"
            CURRENT_SKU=$(az appservice plan show --ids "$PLAN_ID" --query sku.name -o tsv)
            CURRENT_TIER=$(az appservice plan show --ids "$PLAN_ID" --query sku.tier -o tsv)
            if [ "$CURRENT_TIER" = "Free" ]; then
              SKU="$SKU_INPUT"
              TIER="Basic"
            elif [ "$EVENT_NAME" = "push" ]; then
              SKU="$CURRENT_SKU"
              TIER="$CURRENT_TIER"
            elif [ "$CURRENT_TIER" = "Basic" ]; then
              SKU="$SKU_INPUT"
              TIER="Basic"
            else
              SKU="$CURRENT_SKU"
              TIER="$CURRENT_TIER"
              echo "Preserving existing $TIER plan tier and SKU $SKU to avoid an accidental downgrade."
            fi
            echo "Found existing app: $APP in $RG ($LOCATION), plan $PLAN ($TIER / $SKU)"
          else
            if [ -z "$RG_INPUT" ]; then
              RG="atsh-ai-rg"
              echo "No existing app found; creating the default resource group '$RG'."
              az group create --name "$RG" --location "$LOCATION_INPUT" --output table
            else
              RG="$RG_INPUT"
              az group show --name "$RG" --query '{name:name,location:location}' -o table
            fi
            LOCATION="$LOCATION_INPUT"
            PLAN="${APP}-plan"
            SKU="$SKU_INPUT"
            TIER="Basic"
          fi
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"
          echo "location=$LOCATION" >> "$GITHUB_OUTPUT"
          echo "plan_name=$PLAN" >> "$GITHUB_OUTPUT"
          echo "plan_sku=$SKU" >> "$GITHUB_OUTPUT"
          echo "plan_tier=$TIER" >> "$GITHUB_OUTPUT"
      - name: Validate Bicep
        run: az bicep build --file infra/azure/main.bicep
      - name: Provision or update App Service
        env:
          RG: ${{ steps.resolve.outputs.resource_group }}
          APP: ${{ inputs.app_name || 'atsh-ai-website' }}
          LOCATION: ${{ steps.resolve.outputs.location }}
          PLAN: ${{ steps.resolve.outputs.plan_name }}
          SKU: ${{ steps.resolve.outputs.plan_sku }}
          TIER: ${{ steps.resolve.outputs.plan_tier }}
        run: |
          az deployment group create \
            --resource-group "$RG" \
            --name "atsh-ai-site-${GITHUB_RUN_ID}" \
            --template-file infra/azure/main.bicep \
            --parameters appName="$APP" location="$LOCATION" planName="$PLAN" skuName="$SKU" skuTier="$TIER" \
            --query 'properties.outputs' -o json > deployment-outputs.json
          cat deployment-outputs.json
      - name: Set runtime settings without replacing existing app settings
        env:
          RG: ${{ steps.resolve.outputs.resource_group }}
          APP: ${{ inputs.app_name || 'atsh-ai-website' }}
        run: |
          az webapp config appsettings set \
            --resource-group "$RG" \
            --name "$APP" \
            --settings NODE_ENV=production WEBSITE_NODE_DEFAULT_VERSION='~24' SCM_DO_BUILD_DURING_DEPLOYMENT=false \
            --output none
      - name: Deploy website package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app_name || 'atsh-ai-website' }}
          package: atsh-ai-app.zip
      - name: Verify live health endpoint
        env:
          APP: ${{ inputs.app_name || 'atsh-ai-website' }}
        run: |
          URL="https://${APP}.azurewebsites.net/health"
          for attempt in $(seq 1 12); do
            CODE=$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
              echo "Health check passed: $URL"
              cat /tmp/health.json
              exit 0
            fi
            echo "Waiting for App Service startup (attempt $attempt, HTTP $CODE)"
            sleep 10
          done
          echo "Live health check failed. Do not proceed to domain binding."
          cat /tmp/health.json || true
          exit 1
