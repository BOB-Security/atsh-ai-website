name: Deploy ATSH AI Platform to Azure

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'db/**'
      - '.github/workflows/azure-provision-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atsh-ai-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required production configuration exists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEFAULT_ORGANIZATION_ID: ${{ secrets.DEFAULT_ORGANIZATION_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          for key in DATABASE_URL DEFAULT_ORGANIZATION_ID SESSION_SECRET OWNER_EMAIL OWNER_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $key. Deployment stopped before touching Azure."
              exit 1
            fi
          done
          if [ "${#SESSION_SECRET}" -lt 32 ]; then
            echo "::error::SESSION_SECRET must be at least 32 characters."
            exit 1
          fi
          if [ "${#OWNER_PASSWORD}" -lt 14 ]; then
            echo "::error::OWNER_PASSWORD must be at least 14 characters."
            exit 1
          fi
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSL: require
        run: npm run db:migrate
      - name: Bootstrap owner and organization
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSL: require
          DEFAULT_ORGANIZATION_SLUG: atsh-ai
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: npm run db:bootstrap
      - name: Package platform for Azure App Service
        working-directory: platform
        run: |
          zip -r ../atsh-ai-platform.zip . -x 'node_modules/*' '.data/*' '*.log' 'atsh-ai-platform.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: atsh-ai-platform
          path: atsh-ai-platform.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atsh-ai-platform
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1DF03D06E1D444CCA0654B27E8C75231 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5EF8FCB25D80477A8D0F2FCEE63A981A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A4D19EA9941D4136AF1DD6E315BFA1E2 }}
      - name: Confirm existing production app
        id: app
        run: |
          set -euo pipefail
          APP='atsh-ai-website'
          RG=$(az webapp list --query "[?name=='$APP'].resourceGroup | [0]" -o tsv)
          if [ -z "$RG" ] || [ "$RG" = "None" ]; then
            echo "::error::Existing Azure app atsh-ai-website was not found; refusing to create a replacement automatically."
            exit 1
          fi
          HOST=$(az webapp show --resource-group "$RG" --name "$APP" --query defaultHostName -o tsv)
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
      - name: Configure platform runtime
        env:
          RG: ${{ steps.app.outputs.resource_group }}
          APP: atsh-ai-website
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEFAULT_ORGANIZATION_ID: ${{ secrets.DEFAULT_ORGANIZATION_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          set -euo pipefail
          az webapp config appsettings set --resource-group "$RG" --name "$APP" --settings             NODE_ENV=production WEBSITE_NODE_DEFAULT_VERSION='~22' SCM_DO_BUILD_DURING_DEPLOYMENT=true             DATABASE_URL="$DATABASE_URL" DEFAULT_ORGANIZATION_ID="$DEFAULT_ORGANIZATION_ID"             SESSION_SECRET="$SESSION_SECRET" PUBLIC_BASE_URL="${PUBLIC_BASE_URL:-https://${{ steps.app.outputs.host }}}"             DEFAULT_ORGANIZATION_SLUG=atsh-ai PGSSL=require             OWNER_EMAIL="$OWNER_EMAIL" OWNER_NAME="${{ secrets.OWNER_NAME }}" OWNER_PASSWORD="${{ secrets.OWNER_PASSWORD }}"             RESEND_API_KEY="${RESEND_API_KEY:-}" EMAIL_FROM="${EMAIL_FROM:-}" AI_API_KEY="${AI_API_KEY:-}" AI_MODEL="${AI_MODEL:-}"             --output none
      - name: Deploy new platform
        uses: azure/webapps-deploy@v3
        with:
          app-name: atsh-ai-website
          package: atsh-ai-platform.zip
      - name: Verify live health and readiness
        env:
          HOST: ${{ steps.app.outputs.host }}
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "https://$HOST/health" || true)
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.json; then break; fi
            sleep 10
          done
          if [ "${code:-}" != "200" ]; then cat /tmp/health.json || true; echo "::error::Health check failed."; exit 1; fi
          ready=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "https://$HOST/ready" || true)
          if [ "$ready" != "200" ]; then cat /tmp/ready.json || true; echo "::error::Readiness check failed; platform is not ready."; exit 1; fi
          cat /tmp/health.json
          cat /tmp/ready.json
