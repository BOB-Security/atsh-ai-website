name: ATSH AI Platform Rebuild CI
on:
  push:
    branches:
      - rebuild/atsh-ai-from-scratch
      - release/port-mfa-to-rebuild
      - hardening/migration-integrity-tests
    paths:
      - 'platform/**'
      - 'db/**'
      - 'docs/TRACEABILITY.md'
      - '.github/workflows/rebuild-platform-ci.yml'
      - '.github/workflows/platform-staging-deploy.yml'
  pull_request:
    branches:
      - main
      - rebuild/atsh-ai-from-scratch
    paths:
      - 'platform/**'
      - 'db/**'
      - 'docs/TRACEABILITY.md'
      - '.github/workflows/rebuild-platform-ci.yml'
      - '.github/workflows/platform-staging-deploy.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atsh_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atsh_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/atsh_ai_test
      PGSSL: disable
      DEFAULT_ORGANIZATION_SLUG: atsh-ai
      OWNER_EMAIL: owner@test.local
      OWNER_NAME: CI Owner
      OWNER_PASSWORD: ThisIsOnlyATestPassword_123!
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only
      - run: npm install
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:bootstrap
      - run: npm test
