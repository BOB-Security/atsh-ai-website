<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استعادة كلمة المرور — ATSH AI</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css"><script src="/password-reset.js" defer></script></head>
<body><header class="header"><a class="brand" href="/">ATSH AI</a><a class="button ghost" href="/admin/">العودة لتسجيل الدخول</a></header><main class="wrap section"><section class="login-panel"><p class="eyebrow">وصول آمن</p><h1 id="reset-title">استعادة كلمة المرور</h1><form id="request-form"><p>أدخل البريد الإلكتروني المسجل، وسنرسل رابطًا إذا كان الحساب نشطًا.</p><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email"></label><button class="button primary">إرسال رابط الاستعادة</button></form><form id="confirm-form" hidden><p>اختر كلمة مرور جديدة لا تقل عن 14 حرفًا.</p><label>كلمة المرور الجديدة<input name="password" type="password" minlength="14" maxlength="256" required autocomplete="new-password"></label><button class="button primary">تغيير كلمة المرور</button></form><p id="reset-status" role="status"></p></section></main></body></html>
