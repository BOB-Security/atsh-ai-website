<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدعم الفني — ATSH AI</title><link rel="stylesheet" href="/styles.css"><script src="/support.js" defer></script></head><body><header class="header"><a class="brand" href="/">atsh<span>·</span>ai</a><a class="button ghost" href="/">الرئيسية</a></header><main class="wrap section"><p class="eyebrow">SUPPORT</p><h1>كيف يمكننا مساعدتك؟</h1><p class="lead">أرسل طلب الدعم مع بيانات التواصل. سننشئ رقمًا مرجعيًا بعد حفظ التذكرة بنجاح.</p><form id="support-form" class="admin-form"><label>الاسم<input name="name" required minlength="2" maxlength="120"></label><label>البريد الإلكتروني<input name="email" type="email" required maxlength="254"></label><label>الهاتف (اختياري)<input name="phone" maxlength="40"></label><label>الموضوع<input name="subject" required minlength="3" maxlength="200"></label><label>التفاصيل<textarea name="description" required minlength="5" maxlength="10000" rows="5"></textarea></label><label class="consent"><input name="consent" type="checkbox" required><span>أوافق على استخدام بياناتي للرد على طلب الدعم وفق سياسة الخصوصية.</span></label><button class="button primary">إرسال طلب الدعم</button></form><p id="support-status" role="status" aria-live="polite"></p></main></body></html>
