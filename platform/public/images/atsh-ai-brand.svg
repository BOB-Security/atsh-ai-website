<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
<title id="title">ATSH AI</title><desc id="desc">ATSH AI wordmark with a circular brushed-metal ATSH technology emblem inspired by the supplied reference.</desc>
<defs>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f8f8"/><stop offset=".22" stop-color="#9da4a9"/><stop offset=".48" stop-color="#e4e6e7"/><stop offset=".72" stop-color="#747d83"/><stop offset="1" stop-color="#d4d8da"/></linearGradient>
 <radialGradient id="coin" cx="35%" cy="24%" r="82%"><stop stop-color="#f0f1f0"/><stop offset=".52" stop-color="#a7abad"/><stop offset=".83" stop-color="#d8dad9"/><stop offset="1" stop-color="#60686d"/></radialGradient>
 <linearGradient id="engrave" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c2023"/><stop offset=".48" stop-color="#41474b"/><stop offset="1" stop-color="#080a0c"/></linearGradient>
 <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="2"/><feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- metallic coin and concentric machined rim -->
<circle cx="94" cy="82" r="72" fill="#090c10" stroke="#4d555b" stroke-width="2"/>
<circle cx="94" cy="80" r="67" fill="url(#coin)" stroke="#e4e7e8" stroke-width="2.4"/>
<circle cx="94" cy="80" r="60" fill="none" stroke="#737b80" stroke-width="1.6"/>
<circle cx="94" cy="80" r="56.5" fill="none" stroke="#f3f4f4" stroke-opacity=".75" stroke-width=".9"/>
<!-- circuit traces etched into the coin -->
<g fill="none" stroke="url(#engrave)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#drop)">
 <path d="M35 57H53V42H64M31 77H48M39 101H55V116H66M129 42H142V56H155M140 78H158M127 113H141V101H154"/>
 <path d="M63 42V34M55 116V126M142 56V48M141 101V113"/>
</g>
<g fill="url(#coin)" stroke="#343b40" stroke-width="1.3">
 <circle cx="34" cy="57" r="4"/><circle cx="29" cy="77" r="4"/><circle cx="38" cy="101" r="4"/><circle cx="64" cy="33" r="4"/><circle cx="66" cy="126" r="4"/><circle cx="155" cy="56" r="4"/><circle cx="160" cy="78" r="4"/><circle cx="154" cy="101" r="4"/><circle cx="129" cy="42" r="4"/><circle cx="141" cy="114" r="4"/>
</g>
<!-- engraved monogram -->
<g fill="url(#engrave)" stroke="#5e666b" stroke-width="1.1" stroke-linejoin="round" font-family="Arial,sans-serif" font-weight="900" text-anchor="middle">
 <text x="94" y="94" font-size="43" letter-spacing="-5">ATSH</text>
</g>
<text x="190" y="110" fill="#eef1f3" font-family="Arial,sans-serif" font-size="82" font-weight="700" letter-spacing="-3">atsh</text>
<text x="390" y="110" fill="#ff6b72" font-family="Arial,sans-serif" font-size="82" font-weight="700" letter-spacing="-3">ai</text>
<path d="M191 128H487" stroke="#89939c" stroke-width="2"/>
<text x="492" y="126" fill="#aeb8c1" font-family="Arial,sans-serif" font-size="13" letter-spacing="4">INTELLIGENCE</text>
</svg>